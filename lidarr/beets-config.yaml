plugins: musicbrainz chroma embedart lastgenre lyrics deezer mbsync
art_filename: coverart
threaded: yes
per_disc_numbering: yes
id3v23: no
asciify_paths: true

lyrics:
    auto: yes
    sources: [lrclib, lrcmux, genius]
    synced: yes
    keep_synced: yes

match:
    strong_rec_thresh: 0.15
    medium_rec_thresh: 0.25 # 0.25
    rec_gap_thresh: 0.25 # 0.25
    max_rec:
        missing_tracks: medium # medium
        unmatched_tracks: medium # medium
        track_length: medium
        track_index: medium
    distance_weights:
        source: 2.0 # 2.0
        artist: 3.0 # 3.0
        album: 3.0 # 3.0
        media: 1.0 # 1.0
        mediums: 1.0 # 1.0
        year: 1.0 # 1.0
        country: 0.5 # 0.5
        label: 0.5 # 0.5
        catalognum: 0.5 # 0.5
        albumdisambig: 0.5 # 0.5
        album_id: 5.0 # 5.0
        tracks: 2.0 # 2.0
        missing_tracks: 0.9 # 0.9
        unmatched_tracks: 0.6 # 0.6
        track_title: 3.0 # 3.0
        track_artist: 2.0 # 2.0
        track_index: 1.0 # 1.0
        track_length: 2.0 # 2.0
        track_id: 5.0 # 5.0
    preferred:
        countries: [] # []
        media: [] # []
        original_year: no # no
    ignored: []
    required: [] # []
    ignored_media: [] # []
    ignore_data_tracks: yes # yes
    ignore_video_tracks: yes # yes
    track_length_grace: 10 # 10
    track_length_max: 30 # 30

paths:
    # Display-only equivalent of the Lidarr naming formats; import does not move files.
    "disctotal:2..": $album ($year)/CD$disc/$artist-$album-CD$disc-$track-$title-[$bitrate]-$data_source
    default: $album ($year)/$artist-$album-$track-$title-[$bitrate]-$data_source
    singleton: $artist-$title-[$bitrate]-$data_source
    comp: $album ($year)/$artist-$album-$track-$title-[$bitrate]-$data_source
    albumtype_soundtrack: $album ($year)/$artist-$album-$track-$title-[$bitrate]-$data_source
        
import:
    write: yes
    copy: no
    move: no
    resume: ask
    incremental: no
    quiet_fallback: skip
    timid: no
    duplicate_action: skip
    log: /config/extended/beets.log
    languages: ['en']
    group_albums: no

chroma:
    auto: yes

embedart:
    auto: yes
    
lastgenre:
    auto: yes
    canonical: yes
    count: 7
    fallback: null
    force: yes
    keep_existing: yes
    min_weight: 10
    prefer_specific: no
    source: track
    whitelist: /config/extended/beets-genre-whitelist.txt
    title_case: yes

musicbrainz:
    data_source_mismatch_penalty: 0.0
    # Seed genres from MusicBrainz; lastgenre preserves these and adds Last.fm genres.
    genres: yes
    external_ids:
        spotify: yes
        bandcamp: yes
        deezer: yes
        tidal: yes

deezer:
    data_source_mismatch_penalty: 0.5

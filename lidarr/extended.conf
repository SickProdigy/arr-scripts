##### LIDARR EXTENDED SCRIPTS SETTINGS #####
# This file is sourced by Bash. Put credentials in single quotes, for example: subsonicPassword='p@ss$word'
# If a credential contains an apostrophe, use double quotes and escape Bash characters such as $ as \$.

##### PATHS
downloadPath="/downloads/lidarr/downloads" # OPTIONAL, only change if needed.... Temporary Download Location for incoming Audio files from included clients
importPath="/downloads/lidarr/import"      # OPTIONAL, only change if needed.... Completed downloads are stored here for the Usenet Blackhole client to import from. When Using queue cleaner, failed imports will be automatically cleaned up.
videoPath=""                              # Final destination/location of completed Videos

##### WEB DASHBOARD
enableDashboard="false" # true = run the optional arr-scripts dashboard service
dashboardPort="8687" # Dashboard container port; Lidarr itself remains on 8686
dashboardBindAddress="0.0.0.0" # Listen address inside the container; normally leave unchanged
dashboardUsername="" # Optional HTTP login; set both username and password before exposing beyond a trusted network
dashboardPassword=''
dashboardPreviewMaxAgeHours="24" # A write task can use a successful preview for this many hours

##### SCRIPT ENABLEMENT
enableAutoConfig="true"            # true = enabled :: Automatically configures Lidarr with optimal settings
enableAudio="true"                 # true = enabled :: Enables the Audio script to run automatically
enableVideo="true"                 # true = enabled :: Enables the Video script to run automatically
enableUnmappedFilesCleaner="false" # true = enabled :: Enables the UnmappedFilesCleaner script to run automatically
enableQueueCleaner="true"          # true = enabled :: Enables the QueueCleaner script to run automatically
enableChangeCategory="true"        # true = enabled :: Only Applys to Torrents; "enableQueueCleaner" must be true or this is ignored; Used to avoid Hit-and-Runs

##### SCRIPT INTERVALS
audioScriptInterval=15m                 #s or #m or #h or #d :: s = seconds, m = minutes, h = hours, d = days :: Amount of time between each script run, when script is enabled
videoScriptInterval=15m                 #s or #m or #h or #d :: s = seconds, m = minutes, h = hours, d = days :: Amount of time between each script run, when script is enabled
autoArtistAdderInterval=12h             #s or #m or #h or #d :: s = seconds, m = minutes, h = hours, d = days :: Amount of time between each script run, when script is enabled
unmappedFolderCleanerScriptInterval=15m #s or #m or #h or #d :: s = seconds, m = minutes, h = hours, d = days :: Amount of time between each script run, when script is enabled
queueCleanerScriptInterval=15m          #s or #m or #h or #d :: s = seconds, m = minutes, h = hours, d = days :: Amount of time between each script run, when script is enabled

##### AUTOCONFIG SCRIPT SETTINGS
configureMediaManagement="false"               # Configures Lidarr Media Management Settings
configureMetadataConsumerSettings="false"      # Opt in to Kodi/Emby NFO files and extra images; leave false for Beets artwork
configureMetadataProviderSettings="false"      # Configures Lidarr Metadata Provider Settings
configureCustomScripts="true"                  # Adds custom scripts to Lidarr
configureLidarrUiSettings="false"              # Configures Lidarr UI Settings
configureMetadataProfileSettings="false"       # Configures Lidarr Metadata Profile Settings
configureTrackNamingSettings="false"           # Configures Lidarr Track Naming Settings

##### AUDIO DOWNLOADS
# SEARCH
searchSort="date"                 # date or album :: Sorts the missing/cutoff list by release date (newest -> oldest) or album type (album -> single) for processing the list
matchDistance="3"                 # The number of changes required to transform the searched album title into a possible found album title match... (0, requires a perfect match)
deezerDetailLookupLimit="20"      # Maximum full Deezer album-detail requests allowed per search
lidarrSearchForMissing="true"     # true = enabled :: When artists are added, search for them using Lidarr's built in functionality
retryNotFound="90"                ## :: Number of days between re-attempting the download of previously notfound albums
streamingNotFoundRetrySchedule="7,30,60" # Tidal/Deezer combined catalog misses; last delay repeats
ignoreInstrumentalRelease="false" # true = enabled :: Skips albums releases that have the word "instrumental" in either the title or disambiguation
preferSpecialEditions="true"      # true = enabled :: This changes the release title sort order, when true, it will search for releases with longest release names first, which are more likely to be deluxe/special versions...

# CLIENT
dlClientSource="deezer"                # deezer, tidal, both (legacy), soulseek, all, or a comma-separated list; Soulseek also requires enableSoulseek=true
arlToken=''                            # OPTIONAL (fallback using Freyr) - User ARL token for deemix client
tidalCountryCode="US"                  # Country Code required for tidal
failedDownloadAttemptThreshold="6"     # Maximum number of attempts to download a particular album ID from the service before considering it a failed download...
failedDownloadRetryDays="7,14,30"      # Retry schedule after repeated Deezer/Tidal download failures; the last value repeats
deezerClientTestDownloadId="197472472" # A known good deezer track id that is used to test/verify the client is functioning in the event all download attempts have failed. Prevents the script from exiting...
tidalClientTestDownloadId="166356219"  # A known good tidal track id that is used to test/verify the client is functioning in the event all download attempts have failed. Prevents the script from exiting...
downloadClientTimeOut="10m"            # 's' for seconds (the default), 'm' for minutes, 'h' for hours or 'd' for days :: Kills freyr download client after the set timeout period, prevents lock ups...
networkConnectTimeout="10"             # Seconds allowed to establish an HTTP connection
networkMaxTime="60"                    # Maximum seconds allowed for each HTTP request
networkRetryCount="2"                  # Number of retries for transient HTTP failures
lidarrPageSize="250"                   # Records requested per Lidarr wanted API page
lidarrTaskWaitTimeout="300"            # Maximum seconds to wait for blocking Lidarr tasks before deferring this audio cycle

# QUALITY
audioLyricType="both"     # Prefer explicit releases, then allow clean when no explicit match exists
audioFormat="native"    # native or alac or mp3 or aac or opus :: native is the native download client file type, selected by the matching audio bit-rate
audioBitrate="master" # master prefers HiRes lossless when available; requireQuality=false allows lossless fallback
requireQuality="false"  # true = enabled :: Downloads will be checked for quality and require to have the requested file format & quality

##### SOULSEEK DOWNLOADS
enableSoulseek="false" # true = enabled; Lidarr also selects soulseek/all in dlClientSource
soulseekClient="slskd" # slskd or nicotine (requires the API plugin from SickProdigy/nicotineplus-plugins)
soulseekUrl="http://slskd:5030" # Client API URL; Nicotine+ example: http://nicotineplus:12339
soulseekApiKey='' # Client API key; Soulseek login stays in the selected client
soulseekDownloadPath="/downloads/soulseek" # Mount the selected client's COMPLETED download root here in each Arr container
soulseekFallbackDelay="3600" # Seconds missing before fallback; streaming misses in Lidarr become eligible immediately

soulseekOfflineDelay="900" # Seconds continuously offline before another candidate may start (15 minutes)
soulseekOfflineGrace="86400" # Seconds continuously offline before cancelling the owned batch (24 hours)
soulseekFailedRetryDays="30" # Exclude a failed peer/remote-folder candidate for this many days
soulseekFailedSearchDays="7" # Retry a Soulseek search with no eligible candidates after this many days
soulseekMaxBatches="3" # Maximum total active foreground and offline background batches per app (1-10); review jobs do not consume slots
soulseekMaxForegroundBatches="3" # Maximum active Soulseek searches/download batches per app (1-10)
soulseekLogLevel="info" # info logs lifecycle events; debug also logs response/candidate counts without peer names
soulseekReleaseGroups="" # Comma-separated release groups to add, or the complete allowlist when mode=replace
soulseekReleaseGroupMode="extend" # extend = built-in groups plus your list; replace = use only your list

##### AUDIO PROCESSING
# BEETS
enableBeetsTagging="true"   # true = enabled :: Fully enrich imported releases with Beets at their final Lidarr library path
beetsMatchPercentage="85"   # 1-100 :: Set this to the minimum percentage required for Beets to match the downloaded album to a musicbrainz release :: Lower percentage is less restrictive

# REPLAYGAIN
enableReplaygainTags="true" # true = enabled :: Lidarr release-import and upgrade events will be tagged with ReplayGain metadata after import. ReplayGain does not modify audio samples.
enableReplaygainMaintenance="false" # true = periodically audit and repair missing/partial tags; requires enableReplaygainTags=true
replaygainMaintenanceDays="7" # Positive integer :: Days between attempts; first run starts when enabled
replaygainTargetLoudness="-18" # -30 through -5 LUFS :: ReplayGain 2.0 standard target is -18 LUFS. Use a player/preamp/amplifier setting if this sounds quieter; do not silently raise the target.
replaygainThreads="1" # Positive integer or MAX :: Parallel album jobs for explicit backfill workflows; normal Lidarr events process one album folder.
replaygainPreserveMtime="true" # true = preserve file modified times while writing ReplayGain metadata tags
replaygainClipMode="p" # n, p, or a :: Clipping protection for none, positive gain only (rsgain recommended default), or all gain values.
replaygainTruePeak="false" # true = measure inter-sample true peaks; false = use faster sample-peak measurement.
replaygainMaxPeak="0" # 0 or negative dB :: Playback peak ceiling used by clipping protection.

# LYRICS
enableLyrics="true"
enableLyricsMaintenance="false" # true = periodically enqueue missing lyrics across the library
lyricsMaintenanceDays="7" # Days between successful library scans
lyricsLibraryRoot="/music" # Container path scanned for missing lyrics # Queue missing lyrics after tagging; LRCMux runs in the background
lyricsTimeout="3m" # Maximum background worker run; imports never wait for provider requests
lyricsUrl="https://api.lrcmux.dev" # Optional custom/self-hosted LRCMux endpoint

##### RATINGS AND MUSICBRAINZ
# MUSICBRAINZ CONTRIBUTIONS
enableMusicBrainzHelper="true" # Contribute genres and eligible Subsonic ratings under your MusicBrainz account
musicBrainzUsername="" # MusicBrainz account name and local account label
musicBrainzPassword='' # Digest token recommended; the value is sent as the Digest password
musicBrainzToken='' # Legacy alias used only when musicBrainzPassword is blank
musicBrainzOAuthClientId='' # Optional OAuth fallback: Installed Application client ID
musicBrainzOAuthClientSecret='' # Optional OAuth fallback: Installed Application client secret
musicBrainzOAuthRedirectUri="urn:ietf:wg:oauth:2.0:oob" # Headless one-time authorization callback

# SONICRATINGS AND MUSICBRAINZ RATINGS
enableRatings="false" # SonicRatings: fill unrated imported songs in Subsonic; MusicBrainz contributions use enableMusicBrainzHelper
subsonicUrl="" # Full URL including http:// or https://; examples: https://navidrome.example.com or http://navidrome:4533 (no trailing slash)
subsonicUsername="" # Ratings belong to this Subsonic user
subsonicPassword='' # This Subsonic user's password; kept out of command arguments and logs
lastfmApiKey='' # Used by Last.fm rating generation or optional Last.fm contributions
# SonicRatings generation providers; use a comma-separated order for fallback. Empty selects lastfm when its key is set, otherwise musicbrainz.
ratingsProvider="" # Example: musicbrainz,lastfm; supported: spotify, lastfm, musicbrainz, tidal, discogs
spotifyClientId=""
spotifyClientSecret=''
tidalClientId=""
tidalClientSecret=''
# SonicRatings shares tidalCountryCode from the download settings above.
discogsToken=''
discogsInheritAlbumRating="false" # Explicit permission to apply Discogs album ratings to tracks
# Contribution source: subsonic, or lastfm for unrated recordings.
ratingsSource="subsonic"
ratingsScriptInterval=15m # Check library ratings for changes; import jobs retry every minute

##### LIBRARY MAINTENANCE
enableLibraryMaintenance="false" # true = enable the read-only audit schedule and approved-job worker
navidromeScriptsVersion="0.14.1" # Published PyPI version; setup installs this exact package when enabled
libraryMaintenanceRoot="/music" # Library root visible inside the Lidarr container
libraryMaintenanceRemoteRoot="" # Empty = same root; set when the Lidarr API reports a different music-root path
libraryMaintenanceNavidromePrefix="" # Optional Navidrome API path prefix, e.g. Music-Library; used only for reviewed renames
libraryMaintenanceDays="7" # Positive integer :: Days between read-only unmapped-file audits
libraryMaintenanceDateAudit="false" # true = include a full embedded-date audit; no automatic date repair
libraryMaintenanceBeetsPreview="true" # true = include a read-only, exact-release Beets preview in approved jobs

##### ARTIST AUTOMATION
addDeezerTopArtists="false"              # true = enabled :: Enabling this will enable the extended script to automatically add artists that are on the Deezer Top Artist Chart to your existing Lidarr instance
addDeezerTopAlbumArtists="false"         # true = enabled :: Enabling this will enable the extended script to automatically add artists that are on the Deezer Top Album Chart to your existing Lidarr instance
addDeezerTopTrackArtists="false"         # true = enabled :: Enabling this will enable the extended script to automatically add artists that are on the Deezer Top Track Chart to your existing Lidarr instance
topLimit="3"                             # This setting controls the amount of Top Artist (Albums/Tracks/Artists) to add to Lidarr from Deezer
addRelatedArtists="false"                # true = enabled :: WARNING !!! WARNING !!! Enabling this can cause an endless loop of additional artists.... Enabling this will enable the extended script to automatically add artists that are related to your existing Lidarr artists from Tidal & Deezer
numberOfRelatedArtistsToAddPerArtist="1" # 1-20 :: This will limit the number of related artists to add per artist in your library :: Minimum is 1, Maximum is 20
autoArtistAdderMonitored="true"          # true or false :: If true, artists that are added automatically are monitored, when false they are added in an unmonitored state
preventRelatedArtistsLoop="true"         # true = enabled :: This will prevent added related artists from adding additional related artists, thus killing an endless loop. This works by using the Lidarr's tag system (arr-extended), Remove tag from artist to allow it to be proessed for related artists...

##### VIDEO
addFeaturedVideoArtists="false"  # true = enabled :: WARNING !!! WARNING !!! Enabling this can cause an endless loop of additional artists.... Enabling this will enable the extended Video script to automatically add Music Video Featured Artists to your existing Lidarr artists from IMVDB
videoFormat="bv[width>=1920]+ba" # ONLY CHANGE if you know what your doing, for guidence, please see yt-dlp documentation.
videoInfoJson="false"            # true = enabled :: Stores yt-dlp info-json files alongside video files.
youtubeSubtitleLanguage="en"     # Desired Language Code :: For guidence, please see yt-dlp documentation.
disableImvd="false"              # true = enabled :: Use this to disable IMVDB as a source, will result in only tidal videos

##### NOTIFICATIONS
# PLEX
enablePlexNotify="false" # true = register and run PlexNotify; requires plexUrl and plexToken
plexUrl=""   # ONLY used if PlexNotify.bash is used, example: http://x.x.x.x:32400
plexToken='' # ONLY used if PlexNotify.bash is used

# DEEZER ARL CHECKER
arlUpdateInterval="24h"   # Interval to check ARL Validity (default 24 hours). Reboot container after changing. s = seconds, m = minutes, h = hours, d = days
telegramBotEnable="false" # Enable/Disable  Telegram Bot to notify if ARL expires. Otherwise check text file in custom-services.d/python for status.
telegramBotToken=''       # Get token from BotFather during bot creation. If you use a notify channel for Lidarr, you can probably use the same bot, as this script only takes temporary control.
telegramUserChatID=""     # Get your userid by chatting: t.me/userinfobot
pushoverEnable="false"    # Pushover Notification Support
pushoverUserKey=''
pushoverAppAPIKey=''
ntfyEnable="false"        # ntfy Notification Support
ntfyServerTopic=""        # Put your server + topic address ex: https://ntfy.mydomain.com/lidarr
ntfyUserToken=''          # create a new user token using the ntfy cli commands. See ntfy documentation on how to do that.
AppriseEnable="false"     # Enable/Disable Apprise, a versatile tool for sending notifications to over 100 services.
AppriseString=''          # Enter your Apprise URL here (e.g., discord://webhook_id/webhook_token, mailto://user:pass@example.com). See https://github.com/caronc/apprise/wiki for details.
